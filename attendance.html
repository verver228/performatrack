<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/images/uphsd-logo.png" />
    <title>PERFORMATRACK | Attendance</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/styles.css?v=app-loading-screen-v1" />
  </head>
  <body data-app-scripts="assets/js/auth-guard.js,assets/js/attendance.js">
    <div class="app-loading-screen" id="appLoadingScreen" role="status" aria-live="polite">
      <span class="app-loading-spinner" aria-hidden="true"></span>
      <span>Loading PERFORMATRACK...</span>
    </div>
    <div class="d-lg-flex app-shell">
      <aside class="sidebar p-3 p-lg-4">
        <div class="d-flex align-items-center mb-4">
          <img class="sidebar-logo me-2" src="assets/images/uphsd-logo.png" alt="UPHSD logo" />
          <div>
            <h1 class="h6 mb-0 text-white">PERFORMATRACK</h1>
            <small class="text-white-50" id="sidebarWelcome">Welcome</small>
          </div>
        </div>
        <nav class="nav flex-column">
          <a class="nav-link" href="teacher-dashboard.html">Teacher Dashboard</a>
          <a class="nav-link" href="grades.html">Grades</a>
          <a class="nav-link active" href="attendance.html">Attendance</a>
          <a class="nav-link" href="reports.html">Reports</a>
          <a class="nav-link mt-3" href="index.html">Logout</a>
        </nav>
      </aside>

      <main class="content-wrap p-3 p-lg-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div>
            <h2 class="h4 mb-0 text-primary-custom">Attendance</h2>
          </div>
        </div>

        <div class="att-toolbar">
          <label class="att-field">
            <span>Date</span>
            <input type="date" id="attendanceDate" class="form-control" />
          </label>
          <button type="button" id="todayBtn" class="btn btn-outline-secondary">Today</button>
          <div class="att-toolbar-spacer"></div>
          <button type="button" id="markAllPresentBtn" class="btn btn-success">Mark all present</button>
          <button type="button" id="clearDayBtn" class="btn btn-outline-danger">Clear day</button>
        </div>

        <div class="att-summary" id="attendanceSummary"></div>

        <div class="card">
          <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h3 class="h6 mb-0">Roll call <span id="rollCallDateLabel" class="text-muted fw-normal"></span></h3>
            <small class="text-muted" id="markedCountLabel"></small>
          </div>
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle att-table">
              <thead class="table-light">
                <tr>
                  <th>Student</th>
                  <th class="text-center">Status</th>
                  <th class="text-end">Overall rate</th>
                </tr>
              </thead>
              <tbody id="rollCallBody"></tbody>
            </table>
          </div>
        </div>

        <p id="attendanceFormMessage" class="small text-muted mt-2 mb-0"></p>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/page-loader.js?v=persistent-sidebar-welcome-v1"></script>
  </body>
</html>
